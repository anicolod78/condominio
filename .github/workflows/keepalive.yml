# I progetti Supabase gratuiti vanno in pausa dopo 7 giorni senza richieste:
# questo job chiama la funzione public.ping() ogni 3 giorni.
name: Keepalive Supabase

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ping
        run: |
          URL=$(sed -n "s/^export const SUPABASE_URL = '\(.*\)';/\1/p" web/config.js)
          KEY=$(sed -n "s/^export const SUPABASE_KEY = '\(.*\)';/\1/p" web/config.js)
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
